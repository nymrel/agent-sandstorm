name: Release & Publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to publish (for example, v0.1.0)
        required: true
        type: string
      confirmation:
        description: Explicit publication gate
        required: true
        default: hold
        type: choice
        options:
          - hold
          - publish

permissions:
  contents: read

jobs:
  validate:
    name: Validate release candidate
    if: inputs.confirmation == 'publish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify tag checkout and package versions
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"
          tag_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
          test "$(git rev-parse HEAD)" = "${tag_commit}"
          echo "commit_sha=${tag_commit}" >> "${GITHUB_OUTPUT}"
          node scripts/check-release-version.mjs
      - run: npm ci
      - run: npm run test:node
      - run: npm run check:package
      - run: python -m pip install --upgrade build twine
      - run: python scripts/test_python.py
      - run: python -m build --outdir python-dist
      - run: python -m twine check python-dist/*
      - run: python scripts/check_python_package.py python-dist

  publish-npm:
    name: Publish npm package
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish Python package
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/p/agent-sandstorm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade build
      - run: python -m build --outdir python-dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python-dist/
