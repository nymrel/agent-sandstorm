---
# yamllint disable rule:line-length
# yamllint disable rule:truthy
name: Continuous integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    env:
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_IGNORE_SCRIPTS: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Pin npm
        # npm is the package manager under test and is pinned outside the project lockfile.
        # zizmor: ignore[adhoc-packages]
        run: npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run Node and package contracts
        run: |
          npm run test:node
          npm run check:package

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run isolated Python contracts
        run: |
          python scripts/test_python.py
          python -m compileall -q python/agent_sandstorm

  packages:
    name: Distribution contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false
          version: 0.12.7

      - name: Pin npm and install locked dependencies
        # npm is the package manager under test and is pinned outside the project lockfile.
        # zizmor: ignore[adhoc-packages]
        run: |
          npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify the npm package boundary
        run: npm run check:package

      - name: Build and verify Python distributions
        run: |
          uvx --from build@1.6.0 pyproject-build --outdir python-dist
          uvx twine@7.0.0 check python-dist/*
          python scripts/check_python_package.py python-dist
          python -m pip install --force-reinstall python-dist/*.whl
          python -c "import agent_sandstorm; assert agent_sandstorm.__version__ == '0.1.0'"
          sandstorm-py --help

  security:
    name: Supply-chain and static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false
          version: 0.12.7

      - name: Install locked JavaScript dependencies
        # npm is the package manager under test and is pinned outside the project lockfile.
        # zizmor: ignore[adhoc-packages]
        run: |
          npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Fail on dependency vulnerabilities
        run: |
          npm run audit:ci
          uvx pip-audit@2.10.1 .

      - name: Check Python correctness and security rules
        run: |
          uvx ruff@0.16.5 check python scripts
          uvx bandit@1.9.4 -r python/agent_sandstorm -ll -ii

      - name: Audit GitHub Actions definitions
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054  # v0.6.2
        with:
          advanced-security: false
          annotations: true
          min-confidence: medium
          min-severity: medium
          online-audits: false
          persona: auditor
          version: 1.29.0

  cross-platform:
    name: ${{ matrix.os }} contracts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.13'

      - name: Pin npm and install locked dependencies
        # npm is the package manager under test and is pinned outside the project lockfile.
        # zizmor: ignore[adhoc-packages]
        run: |
          npm install --global npm@11.19.1 --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Run the complete local acceptance gate
        run: npm run check
