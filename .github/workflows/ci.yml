name: Agent Sandstorm CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-sandstorm-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install exact build dependency without creating a lockfile
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false

      - name: Build committed distributions
        run: npm run build

      - name: Run complete Node.js test suite
        run: npm test

      - name: Verify generated distributions are committed
        run: git diff --exit-code -- dist

      - name: Verify npm package contents
        run: npm run pack:check

  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Compile Python sources
        run: python -m compileall -q python/agent_sandstorm

      - name: Install build frontend
        run: python -m pip install --disable-pip-version-check build

      - name: Build wheel and source distribution
        run: python -m build

      - name: Install built wheel
        run: >-
          python -c "import pathlib, subprocess, sys;
          wheel = next(pathlib.Path('dist').glob('*.whl'));
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', str(wheel)])"

      - name: Run Python unit tests against installed package
        run: python -m unittest discover -s python/tests -p "test_*.py"

      - name: Smoke-test installed Python package
        run: python -c "from agent_sandstorm import Sandstorm; print(Sandstorm.__name__)"

      - name: Smoke-test installed Python CLI
        run: sandstorm-py --help
